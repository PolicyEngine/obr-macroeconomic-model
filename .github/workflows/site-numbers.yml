name: Site numbers (scratch)
on:
  workflow_dispatch:
  push:
    branches: [vahid/scratch-site-numbers-6fbbe06]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python scripts/site_numbers_6fbbe06.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-numbers
          path: site_numbers_6fbbe06.json
