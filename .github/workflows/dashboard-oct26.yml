name: Dashboard numbers Oct 2026 (scratch)
on:
  push:
    branches: [vahid/scratch-dashboard-oct26]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python scripts/dashboard_numbers_oct26.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-numbers
          path: dashboard_numbers_oct26.json
